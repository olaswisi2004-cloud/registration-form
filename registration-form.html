
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h1>User Registration</h1>

    <form action="/register" method="POST" enctype="multipart/form-data">
<fieldset>
   <legend>Personal Information</legend>
     <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required minlength="3">
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required minlength="8">
            <br><br>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" required minlength="8">
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
</fieldset>

        <fieldset>
            <legend>Contact Information</legend>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"
            pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
            title="Format: 059-123-4567">
            <br><br>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="3" cols="40"></textarea>
            <br><br>

            <label for="city">City:</label>
            <select id="city" name="city">
                <option value="">-- Select City --</option>
                <option value="Gaza">Gaza</option>
                <option value="Khan Younis">Khan Younis</option>
                <option value="Rafah">Rafah</option>
                <option value="Deir al-Balah">Deir al-Balah</option>
                <option value="Jabalia">Jabalia</option>
            </select>

        </fieldset>

        <fieldset>
            <legend>Preferences</legend>

            <p>Gender:</p>

            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <br><br>

            <p>Interests:</p>

            <input type="checkbox" id="coding" name="interests" value="coding">
            <label for="coding">Coding</label>
            <br>

            <input type="checkbox" id="design" name="interests" value="design">
            <label for="design">Design</label>
            <br>

            <input type="checkbox" id="gaming" name="interests" value="gaming">
            <label for="gaming">Gaming</label>
            <br>

            <input type="checkbox" id="reading" name="interests" value="reading">
            <label for="reading">Reading</label>
            <br>

            <input type="checkbox" id="sports" name="interests" value="sports">
            <label for="sports">Sports</label>

            <br><br>

            <label for="skill">Skill Level (1-10):</label>
            <input type="range" id="skill" name="skill" min="1" max="10" value="5">

        </fieldset>

        <label for="photo">Profile Picture:</label>
        <input type="file" id="photo" name="photo" accept="image/*">
        <br><br>

        <br><br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the Terms and Conditions</label>

        <br><br>

        <button type="submit">Register</button>
        <button type="reset">Clear Form</button>

    </form>

</body>
</html>
